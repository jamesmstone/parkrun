name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Nix flake check
        run: nix flake check -L
