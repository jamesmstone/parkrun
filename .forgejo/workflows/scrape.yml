name: Scrape latest data

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '59 13 * * 6'

jobs:
  scrape:
    runs-on: native
    timeout-minutes: 30
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Build db
        run: nix run .#parkrun-to-sqlite -- 3173185 parkruns.db

      - name: Soundness check
        run: |
          rows=$(nix run nixpkgs#sqlite-utils -- parkruns.db \
            "select count(*) from runs" --csv --no-headers | tr -d '\r')
          echo "runs: $rows"
          [ "$rows" -gt 0 ]

      - name: Commit & push changes
        run: |
          git config user.email "parkrunauto@jamesst.one"
          git config user.name "Automatic update"
          git add parkruns.db
          git diff --cached --quiet || git commit -m "Automated park run update on $(date)"
          git push origin HEAD:main

      - name: Publish database
        # Rename rather than write in place: Datasette holds the database open,
        # and install(1) truncates, so a reader can see a torn file mid-write.
        run: |-
          install -Dm644 parkruns.db /var/lib/datasette-sites/parkrun/.parkruns.db.new
          mv -f /var/lib/datasette-sites/parkrun/.parkruns.db.new /var/lib/datasette-sites/parkrun/parkruns.db
